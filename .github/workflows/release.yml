name: Verify and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npm run build:win
      - name: Verify packaged desktop
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/win-unpacked/Socrates Video Pro.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Desktop smoke test failed' }
      - name: Archive web app
        shell: pwsh
        run: Compress-Archive -Path dist/web/* -DestinationPath dist/Socrates-Video-Pro-Web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Socrates-Video-Pro
          path: |
            dist/*.exe
            dist/*Web.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Socrates-Video-Pro
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.exe *.zip > SHA256SUMS.txt
          gh release create "$TAG" *.exe *.zip SHA256SUMS.txt --title "Socrates Video Pro $TAG" --generate-notes
