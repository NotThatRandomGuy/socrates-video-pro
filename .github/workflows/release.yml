name: Verify and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npm run build:win
      - name: Verify packaged desktop
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/win-unpacked/Socrates Video Pro.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Desktop smoke test failed' }
      - name: Archive web app
        shell: pwsh
        run: Compress-Archive -Path dist/web/* -DestinationPath dist/Socrates-Video-Pro-Web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-and-web
          path: |
            dist/*.exe
            dist/*Web.zip
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:linux
      - name: Verify AppImage and Debian package
        run: |
          chmod +x dist/*.AppImage
          cd dist
          ./Socrates-Video-Pro-*-Linux-*.AppImage --appimage-extract >/dev/null
          timeout 90s xvfb-run -a ./squashfs-root/AppRun --smoke-test
          sudo apt-get update -qq
          sudo apt-get install -y ./*.deb
          timeout 90s xvfb-run -a /opt/Socrates\ Video\ Pro/socrates-video-pro --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:mac -- --${{ matrix.arch }}
      - name: Mount and verify the downloadable Mac app
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          image=(dist/*-macOS-"$EXPECTED_ARCH".dmg)
          hdiutil verify "${image[0]}"
          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${image[0]}"
          trap 'hdiutil detach "$mount_dir"' EXIT
          bundle="$mount_dir/Socrates Video Pro.app"
          binary="$bundle/Contents/MacOS/Socrates Video Pro"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          arch="$(uname -m)"
          lipo -verify_arch "$arch" "$binary"
          "$binary" --smoke-test
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*-macOS-*.dmg
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prepare draft for local signing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v version="${TAG#v}" '/^## / { if (found) exit; found = ($2 == version) } found' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$TAG" dist/*.exe dist/*.zip dist/*.AppImage dist/*.deb dist/*.dmg --draft --title "Socrates Video Pro $TAG" --notes-file release-notes.md
